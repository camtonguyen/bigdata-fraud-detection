# Khung hạ tầng — task T04 (Hoà, chạy thử: Phúc).
# Hive: dùng Hive support có sẵn của Spark (metastore Derby nhúng), dữ liệu là Parquet trên HDFS → không cần container Hive riêng.
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports: ["2181:2181"]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    environment:
      CLUSTER_NAME: fraud
    env_file: ./hadoop/hadoop.env
    ports: ["9870:9870", "9000:9000"]
    volumes: [namenode:/hadoop/dfs/name]

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    depends_on: [namenode]
    env_file: ./hadoop/hadoop.env
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    volumes: [datanode:/hadoop/dfs/data]

  spark-master:
    build: ./spark
    image: fraud-spark
    environment: [SPARK_MODE=master]
    ports: ["8080:8080", "7077:7077"]
    volumes: ["../:/opt/app"]

  spark-worker:
    build: ./spark
    image: fraud-spark
    depends_on: [spark-master]
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=2
    volumes: ["../:/opt/app"]

volumes:
  namenode:
  datanode:
